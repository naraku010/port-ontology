[package]
name = "port-ontology"
version = "0.1.0"
description = "Container terminal operations ontology with delay impact analysis and an MCP server"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "port_ontology_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
tauri = { version = "2.12.7", features = [] }
